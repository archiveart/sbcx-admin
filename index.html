<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문 플랫폼 연구자 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 설문 v7(CLUX) 테마 토큰 — 설문 플랫폼과 같은 값 ===== */
:root{
  --bg:oklch(0.08 0.008 260); --bg-2:oklch(0.12 0.009 260); --bg-3:oklch(0.16 0.010 260);
  --surface:oklch(0.235 0.013 260); --surface-h:oklch(0.28 0.015 260);
  --ink-1:oklch(0.97 0.005 260); --ink-2:oklch(0.74 0.010 260); --ink-3:oklch(0.54 0.012 260);
  --ln:oklch(0.32 0.013 260); --ln-s:oklch(0.42 0.015 260); --pb:oklch(0.28 0.012 260);
  --a1:oklch(0.70 0.22 250); --a1-bg:oklch(0.23 0.08 250); --a1-ln:oklch(0.40 0.16 250);
  --a2:oklch(0.70 0.22 295); --a2-bg:oklch(0.23 0.08 295); --a2-ln:oklch(0.40 0.16 295);
  --a3:oklch(0.72 0.20 155); --a3-bg:oklch(0.23 0.07 155); --a3-ln:oklch(0.40 0.14 155);
  --a4:oklch(0.72 0.20 50);  --a4-bg:oklch(0.23 0.08 50);  --a4-ln:oklch(0.40 0.16 50);
  --ok:oklch(0.72 0.20 155); --warn:oklch(0.75 0.22 55); --bad:oklch(0.68 0.20 25);
  --ok-bg:oklch(0.23 0.07 155); --warn-bg:oklch(0.23 0.08 55); --bad-bg:oklch(0.23 0.08 25);
  --glow:oklch(0.19 0.035 265);
  --mono:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;   /* 전체 Pretendard (숫자는 tabular-nums 로 자리 맞춤) */
  --grad:linear-gradient(90deg,var(--a1),var(--a2) 55%,var(--a3));
  --sb:240px; color-scheme:dark;
}
[data-theme="light"]{
  --bg:oklch(0.98 0.002 260); --bg-2:oklch(0.96 0.003 260); --bg-3:oklch(0.93 0.004 260);
  --surface:oklch(1 0 260); --surface-h:oklch(0.97 0.003 260);
  --ink-1:oklch(0.20 0.010 260); --ink-2:oklch(0.45 0.008 260); --ink-3:oklch(0.60 0.006 260);
  --ln:oklch(0.88 0.005 260); --ln-s:oklch(0.78 0.008 260); --pb:oklch(0.90 0.005 260);
  --a1:oklch(0.55 0.20 250); --a1-bg:oklch(0.95 0.05 250); --a1-ln:oklch(0.70 0.15 250);
  --a2:oklch(0.55 0.20 295); --a2-bg:oklch(0.95 0.05 295); --a2-ln:oklch(0.70 0.15 295);
  --a3:oklch(0.55 0.18 155); --a3-bg:oklch(0.95 0.04 155); --a3-ln:oklch(0.70 0.13 155);
  --a4:oklch(0.60 0.18 50);  --a4-bg:oklch(0.95 0.05 50);  --a4-ln:oklch(0.70 0.14 50);
  --ok:oklch(0.55 0.18 155); --warn:oklch(0.65 0.20 55); --bad:oklch(0.55 0.20 25);
  --ok-bg:oklch(0.95 0.04 155); --warn-bg:oklch(0.95 0.05 55); --bad-bg:oklch(0.95 0.05 25);
  --glow:oklch(0.93 0.02 265); color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink-1);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit} button:disabled{cursor:default;opacity:.5}
input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--a1);text-decoration:none}
.mono{font-family:var(--mono)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.k1{--c:var(--a1);--cb:var(--a1-bg);--cl:var(--a1-ln)} .k2{--c:var(--a2);--cb:var(--a2-bg);--cl:var(--a2-ln)} .k3{--c:var(--a3);--cb:var(--a3-bg);--cl:var(--a3-ln)} .k4{--c:var(--a4);--cb:var(--a4-bg);--cl:var(--a4-ln)}
/* ===== 틀: 왼쪽 메뉴 + 위 막대 + 내용 ===== */
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
.sidebar{background:var(--bg-2);border-right:1px solid var(--pb);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--pb)}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--ink-1);color:var(--bg);font:700 11px/30px var(--mono);text-align:center;font-style:normal;flex:none}
.brand b{display:block;font-size:14px;font-weight:600;letter-spacing:-0.02em;line-height:1.25} .brand small{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
.nav{padding:10px 10px 16px;flex:1}
.nav .kicker{padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;color:var(--ink-2);font-size:13.5px;font-weight:500;transition:background .15s,color .15s;text-align:left}
.nav-item svg{width:16px;height:16px;flex:none;color:var(--ink-3);transition:color .15s}
.nav-item:hover{background:var(--bg-3);color:var(--ink-1)}
.nav-item.active{background:var(--bg-3);color:var(--ink-1);box-shadow:inset 0 0 0 1px var(--ln)} .nav-item.active svg{color:var(--a1)}
.nav-item .cnt{margin-left:auto;font:600 11px var(--mono);color:var(--ink-3);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:1px 6px}
.sb-foot{padding:12px 18px 16px;border-top:1px solid var(--pb);font-size:11.5px;color:var(--ink-3);line-height:1.5}
.sb-foot .mono{font-size:11px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;flex:none;position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--pb);display:flex;align-items:center;gap:14px;padding:0 24px}
.topbar h1{font-size:17px;font-weight:600;letter-spacing:-0.025em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hamb{display:none;width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;color:var(--ink-2)} .hamb:hover{background:var(--bg-3)}
.conn{display:flex;align-items:center;gap:8px;height:30px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--ln);background:var(--bg-2);font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg);flex:none}
.live-dot.off{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)} .live-dot.wait{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)} .live-dot.demo{background:var(--a2);box-shadow:0 0 0 3px var(--a2-bg)}
.theme-toggle{display:flex;gap:2px;padding:2px;border-radius:999px;border:1px solid var(--ln);background:var(--bg-2)}
.theme-toggle button{width:26px;height:26px;border-radius:999px;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.theme-toggle button.on{background:var(--ink-1);color:var(--bg)} .theme-toggle button:hover:not(.on){color:var(--ink-1)}
.content{padding:24px 28px 60px;max-width:1320px;width:100%}
.page{display:none} .page.active{display:block}
.overlay{display:none;position:fixed;inset:0;background:oklch(0 0 0/.5);z-index:29}
/* ===== 구성 요소 ===== */
.kicker{font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.kicker.c{color:var(--c,var(--a1))}
.pt{font-size:21px;font-weight:600;letter-spacing:-0.025em;line-height:1.35}
.lead{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-top:4px}
.muted{font-size:13px;color:var(--ink-3);line-height:1.6}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--bg-2);border:1px solid var(--pb);border-radius:14px;padding:18px 20px;min-width:0}
.card.pad0{padding:0;overflow:hidden} .card .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card h3{font-size:14.5px;font-weight:600;letter-spacing:-0.015em} .card.pad0 .ch{padding:16px 20px 0}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stack{display:grid;gap:14px}
.stat{background:var(--bg-2);border:1px solid var(--pb);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--a1));opacity:.9}
.stat .l{font-size:12.5px;color:var(--ink-3);font-weight:500} .stat .v{font:600 26px/1.15 var(--mono);margin-top:6px;letter-spacing:-0.02em} .stat .s{font-size:12px;color:var(--ink-3);margin-top:4px}
.stat .v small{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:4px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.b-a1{color:var(--a1);background:var(--a1-bg);border-color:var(--a1-ln)} .b-a2{color:var(--a2);background:var(--a2-bg);border-color:var(--a2-ln)} .b-a3{color:var(--a3);background:var(--a3-bg);border-color:var(--a3-ln)} .b-a4{color:var(--a4);background:var(--a4-bg);border-color:var(--a4-ln)}
.b-ok{color:var(--ok);background:var(--ok-bg);border-color:color-mix(in oklch,var(--ok) 40%,transparent)} .b-bad{color:var(--bad);background:var(--bad-bg);border-color:color-mix(in oklch,var(--bad) 40%,transparent)} .b-warn{color:var(--warn);background:var(--warn-bg);border-color:color-mix(in oklch,var(--warn) 40%,transparent)}
.b-mute{color:var(--ink-3);background:var(--bg-3);border-color:var(--ln)} .b-ink{color:var(--bg);background:var(--ink-1)}
.badge.mono{font-family:var(--mono);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;background:var(--a1);color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .2s,transform .12s,opacity .2s}
.btn:hover:not(:disabled){background:var(--a1-ln)} .btn:active:not(:disabled){transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--ln)} .btn.ghost:hover:not(:disabled){background:var(--surface);color:var(--ink-1)}
.btn.danger{background:var(--bad);color:#fff} .btn.danger:hover:not(:disabled){filter:brightness(1.1);background:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px} .btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px}
.btn svg{width:14px;height:14px}
.inp,textarea.inp,select.inp{height:36px;border-radius:9px;border:1px solid var(--ln);background:var(--surface);color:var(--ink-1);padding:0 11px;font-size:13.5px;outline:none;min-width:0} .inp:focus{border-color:var(--a1);box-shadow:0 0 0 3px var(--a1-bg)}
textarea.inp{height:auto;min-height:120px;padding:10px 11px;font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap;background:var(--bg-2);position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--pb);vertical-align:middle;white-space:nowrap} .tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-h)} .tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl td.wrap{white-space:normal;min-width:160px;line-height:1.5} .tbl tr.sel td{background:var(--a1-bg)} .tbl tr.clickable{cursor:pointer}
.segs{display:flex;gap:3px;margin:2px 0 8px} .segs i{flex:1;height:6px;border-radius:3px;background:var(--bg-3)} .segs i.done{background:var(--ok);opacity:.55} .segs i.cur{background:var(--c,var(--a1))}
details.card>summary{list-style:none} details.card>summary::-webkit-details-marker{display:none} details.card>summary:before{content:'▸';display:inline-block;width:14px;color:var(--ink-3)} details.card[open]>summary:before{content:'▾'}
.tbl td.dim{color:var(--ink-3)}
.pbar{height:6px;border-radius:999px;background:var(--bg-3);overflow:hidden;min-width:60px} .pbar i{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .4s}
.hbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12.5px} .hbar .lab{color:var(--ink-2);white-space:nowrap} .hbar .bar{height:8px;border-radius:999px;background:var(--bg-3);overflow:hidden} .hbar .bar i{display:block;height:100%;background:var(--c,var(--a1));border-radius:999px} .hbar .val{font-family:var(--mono);color:var(--ink-2);white-space:nowrap}
.vbars{display:flex;align-items:flex-end;gap:6px;height:72px} .vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end} .vbars .vb i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--c,var(--a1));min-height:2px} .vbars .vb b{font:500 10.5px var(--mono);color:var(--ink-3)}
.cellgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cellgrid .cell{border:1px solid var(--pb);border-radius:10px;padding:9px 10px;background:var(--bg)} .cellgrid .cell .t{font:600 10.5px var(--mono);color:var(--ink-3)} .cellgrid .cell .n{font:600 20px/1.1 var(--mono);margin-top:3px} .cellgrid .cell .n small{font-size:11px;color:var(--ink-3);font-weight:500} .cellgrid .cell .d{font-size:11px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.judge{display:grid;gap:8px} .judge .jr{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--pb);border-radius:10px;background:var(--bg)}
.judge .jr .ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:700 12px var(--mono)} .judge .jr .ic.ok{background:var(--ok-bg);color:var(--ok)} .judge .jr .ic.bad{background:var(--bad-bg);color:var(--bad)} .judge .jr .ic.na{background:var(--bg-3);color:var(--ink-3)}
.judge .jr .t{font-size:13.5px;font-weight:600} .judge .jr .d{font-size:12px;color:var(--ink-3);margin-top:2px;font-family:var(--mono)}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.live-card{background:var(--bg-2);border:1px solid var(--pb);border-radius:12px;padding:14px 16px} .live-card .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px} .live-card .pid{font:600 13px var(--mono)} .live-card .st{font-size:13px;margin:8px 0 6px}
.live-card.stale{opacity:.6}
.tl{display:grid;gap:0;max-height:560px;overflow:auto;border:1px solid var(--pb);border-radius:10px;background:var(--bg)}
.tl .e{display:grid;grid-template-columns:76px 104px 1fr;gap:10px;padding:7px 12px;border-bottom:1px solid var(--pb);font-size:12.5px;align-items:baseline} .tl .e:last-child{border-bottom:0}
.tl .e .t{font-family:var(--mono);color:var(--ink-3);font-size:11.5px} .tl .e .s{font:500 11px var(--mono);color:var(--ink-3)} .tl .e .d{color:var(--ink-2);white-space:normal;word-break:break-all} .tl .e .d b{color:var(--ink-1);font-weight:600;margin-right:6px}
.tl .e.key .d b{color:var(--a1)} .tl .e.key{background:var(--glow)}
.qitem{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--pb);font-size:13px} .qitem:last-child{border-bottom:0} .qitem .code{font:600 12px var(--mono);color:var(--ink-2)} .qitem .txt{color:var(--ink-1)} .qitem .txt.rev:after{content:' (역문항)';color:var(--a4);font-size:12px}
.resp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.resp-card{background:var(--bg-2);border:1px solid var(--pb);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s} .resp-card:hover{border-color:var(--ln-s)} .resp-card.sel{border-color:var(--a1);box-shadow:inset 0 0 0 1px var(--a1)}
.resp-card .h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px} .resp-card .pid{font:600 13px var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px} .kv dt{color:var(--ink-3);white-space:nowrap} .kv dd{color:var(--ink-1);font-family:var(--mono);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .kv.wrap dd{white-space:normal;overflow:visible}
.anslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px} .anslist .a{border:1px solid var(--pb);border-radius:8px;padding:6px 9px;background:var(--bg);font-size:12px} .anslist .a .c{font:600 11px var(--mono);color:var(--ink-3)} .anslist .a .v{font:600 15px var(--mono);margin-top:1px} .anslist .a .r{font:400 10.5px var(--mono);color:var(--ink-3)}
.anslist .a.bad{border-color:color-mix(in oklch,var(--bad) 50%,transparent)} .anslist .a.ok{border-color:color-mix(in oklch,var(--ok) 50%,transparent)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;border:1px solid var(--a4-ln);background:var(--a4-bg);color:var(--ink-1);font-size:13px;margin-bottom:18px} .banner.info{border-color:var(--a1-ln);background:var(--a1-bg)} .banner b{color:var(--a4);white-space:nowrap} .banner.info b{color:var(--a1)}
.banner .sp{flex:1} .banner[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink-1);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:99;box-shadow:0 8px 24px oklch(0 0 0/.3);font-weight:500} .toast.err{background:var(--bad);color:#fff}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--ln);background:var(--bg-2);font-size:12.5px;color:var(--ink-2);transition:all .15s} .chip:hover{border-color:var(--ln-s);color:var(--ink-1)} .chip.on{background:var(--ink-1);color:var(--bg);border-color:var(--ink-1);font-weight:600}
.code{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--pb);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-all;line-height:1.55;color:var(--ink-2);max-height:360px;overflow:auto}
.consent-list .ck{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--pb)} .consent-list .ck:first-child{border-top:0} .consent-list .ck .ct{font-size:14px;font-weight:500} .consent-list .ck .cd{font-size:12.5px;color:var(--ink-3);margin-top:2px} .consent-list .req{color:var(--a1);font-weight:700;margin-right:4px} .consent-list .opt-tag{color:var(--ink-3);font-weight:700;margin-right:4px}
.stgrow{display:flex;gap:6px;flex-wrap:wrap} .stg{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-3);border:1px solid var(--pb);background:var(--bg)} .stg .n{min-width:22px;height:20px;padding:0 4px;border-radius:5px;border:1px solid var(--ln);font:700 10.5px/18px var(--mono);text-align:center;color:var(--ink-3)}
.stg.cur{background:var(--bg-3);color:var(--c);box-shadow:inset 0 0 0 1px var(--ln)} .stg.cur .n{border-color:var(--cl);color:var(--c);background:var(--cb)} .stg.done{color:var(--ink-2)} .stg.done .n{border-color:var(--a3-ln);color:var(--ok);background:var(--a3-bg)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px} .sw input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--bg-3);border:1px solid var(--ln);position:relative;transition:background .2s;cursor:pointer} .sw input:after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-3);transition:all .2s} .sw input:checked{background:var(--a1);border-color:var(--a1)} .sw input:checked:after{left:16px;background:#fff}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr} .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);z-index:30;transform:translateX(-100%);transition:transform .25s} .sidebar.open{transform:none} .overlay.on{display:block}
  .hamb{display:inline-flex} .content{padding:16px 16px 60px} .g2,.g3,.g4,.g5{grid-template-columns:1fr} .topbar{padding:0 14px} .conn span{display:none} .cellgrid{grid-template-columns:repeat(2,1fr)}
}

function logDetailText(e) {
  const d = e.d || {}; const parts = [];
  if (d.code != null) parts.push(`${d.code} = ${d.v}`); if (d.task != null && d.code == null) parts.push(`과업 ${d.task}`);
  if (e.type === 'op') parts.push(d.kind ? `${d.kind} 제외: ${d.v}` : `${d.k} → ${d.v}`); if (e.type === 'op_blocked') parts.push(`${d.kind || d.k}: ${d.v}`);
  if (e.type === 'submit') parts.push(`선택 ${d.selection || ''} · 조작 ${d.ops} · 바뀐 자리 ${d.replaced}`); if (e.type === 'rec_open') parts.push(`${TYPE_NAME[d.type] || d.type} · ${d.x2}`);
  if (e.type === 'step_enter') parts.push(STEP_KIND_LABEL[d.kind] || d.kind); if (e.type === 'assign') parts.push(`${d.source} · c${d.cell} ${d.W} ${d.X2} ${d.order}`);
  if (e.type === 'consent') parts.push(`전화번호 ${d.phone ? '동의' : '거부'} · ${d.version}`); if (e.type === 'visibility') parts.push(d.state); if (e.type === 'scroll') parts.push(`깊이 ${d.depth}`);
  if (e.type === 'resize' || e.type === 'start') parts.push(`${d.vw}×${d.vh}`); if (e.type === 'app_click') parts.push(d.target); if (e.type === 'theme') parts.push(d.theme || JSON.stringify(d)); if (e.type === 'post_fail') parts.push(`${d.sheet}: ${d.err}`);
  if (e.type === 'item_order') parts.push(d.order); if (e.type === 'submit_all') parts.push(d.lottery ? '추첨 번호 있음' : '추첨 번호 없음'); if (e.type === 'tut_sub') parts.push(JSON.stringify(d));
  return parts.length ? parts.join(' · ') : (Object.keys(d).length ? JSON.stringify(d) : '');
}

      <div class="row" style="gap:12px;flex-wrap:wrap;align-items:center"><select class="inp" style="height:28px;font-size:12px" onchange="setDvLock(this.value)"><option value="auto" ${dvLockMode() === 'auto' ? 'selected' : ''}>auto · 11/12 밤 ~ 11/22 24:00 자동 잠금 (기본)</option><option value="on" ${dvLockMode() === 'on' ? 'selected' : ''}>on · 지금부터 잠금</option><option value="off" ${dvLockMode() === 'off' ? 'selected' : ''}>off · 잠금 해제 (기록 남음)</option></select><span class="muted">${esc(dvLockText())}${(((data().meta || {}).ops || {}).dvLockAt) ? ` · 마지막 변경 ${fmtDT(((data().meta || {}).ops || {}).dvLockAt)}` : ''}</span></div>
      <div class="muted" style="margin-top:8px">잠그면 한눈에 보기 · 조건별 비교 · 응답 표에서 M1 · M2 · Y1 · Y3 · Y2 · FIT 평균과 분포가 가려지고 과정 숫자만 보입니다. 파일럿 자료와 CSV 내려받기는 그대로(분석 리허설용). 조원 모두에게 같이 적용됩니다.</div></div>`; })()}
    <div class="card"><div class="ch"><h3>샘플 자료 · 점검</h3></div><div class="row"><button class="btn sm ghost" onclick="seedSample()">샘플 32명 다시 만들기</button><button class="btn sm ghost" onclick="toast(JSON.stringify(Object.fromEntries(PATHS.map(p=>[p,Object.keys(data()[p]||{}).length]))))">저장된 건수 보기</button></div>
      <div class="muted" style="margin-top:10px">주소 뒤에 <span class="mono">?demo=1</span> 을 붙이면 Firebase에 연결하지 않고 샘플만 봅니다. 연결 점검: 실험물 V22_FB_27을 <span class="mono">?dev=1</span>로 열어 끝까지 넘기면 이 화면에 '미리보기'(T###)로 바로 뜹니다. 모집 경로는 <span class="mono">?src=friend</span>(지인) · <span class="mono">?src=agency</span>(업체)를 붙여 보내면 기록되어 '한눈에 보기'와 표(src 열)에서 나뉩니다. 파일럿은 <span class="mono">?pilot=1</span>(참여 번호 R901부터)에 단계를 붙여 보내면 응답 보기에서 저절로 나뉩니다 — ① 인지 인터뷰 <span class="mono">?pilot=1&src=think</span> · ② 자극 사전검사 <span class="mono">?pilot=1&src=pre</span> · ③ 실제 진행 <span class="mono">?pilot=1&src=run</span>. 사전/사후는 V22_FB_24부터 링크에 아무것도 안 붙여도 번갈아 자동 배정합니다(8명이면 4 · 4 · 칸은 그 시점의 8칸 중 덜 쓴 칸) · [다시 해 보기]는 아영 FB_23부터 모두에게 보입니다(RETRY_ALWAYS · ?retry=0 · auto는 무시 · 반복/한 번만 비교 없음) · 한 사람(브라우저)당 한 번만 참여됩니다(ONE_TIME_ONLY · 다시 열면 "이미 참여를 마치셨어요" · 조원이 확인할 때는 ?dev=1) · 번호 · 보상 안내는 없습니다(FB_22). 그래서 사전검사 8명 링크는 모두 같은 <span class="mono">?pilot=1&src=pre</span> 하나면 됩니다(칸은 그 시점(사전/사후)의 8칸 중 덜 쓴 칸 · 판정표 ② 배정 균형 줄에서 확인). <span class="mono">&cell=N</span>을 붙이면 그 칸으로 고정(균형 배정을 안 탐). 단계 없이 들어온 파일럿은 응답 보기 카드의 ① ② ③ 단추로 표시합니다. ③ 실제 진행(11/10)은 <span class="mono">?pilot=1&src=run</span> · 파일럿 링크에서만 25번 화면에 몰입 문항(XIMM)이 함께 나옴. 연결 리허설(16칸 × 2 = 32회 · 파일이 바뀔 때마다 다시)은 <span class="mono">?pilot=1&src=rehearsal&cell=N</span>(칸 고정 · 칸 수 안 올림 · 집계 자동 제외) 또는 매일 점검 탭의 자동 진행 링크. 참여 번호는 실험 R · 인터뷰 P · 합성 사용자 S로 구분합니다.<br>주소(GitHub Pages · 11/8): 참가자용 실험물 <span class="mono">${esc(STUDY.links.survey)}</span> · 리허설 자동 <span class="mono">${esc(STUDY.links.rehearsal)}</span> · 이 화면 <span class="mono">${esc(STUDY.links.admin)}</span> (조원 넷에게만) — 파일을 고치면 같은 이름으로 다시 올려야 주소에 반영됩니다.</div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><div class="kicker" style="margin-bottom:6px">본설문 시작 전에 한 번</div><div class="row"><button class="btn sm ghost" onclick="resetCellCounts()">칸 수 0으로 되돌리기</button><span class="muted">지금 누적 배정 ${((data().meta || {}).cellCounts || {}).total ?? 0}명</span></div><div class="muted" style="margin-top:6px">칸을 지정하지 않은 파일럿 링크(<span class="mono">?pilot=1</span>만)로 들어온 사람은 16칸 배정 수를 하나씩 차지합니다(<span class="mono">?dev=1</span>과 <span class="mono">&cell=N</span> 링크는 안 차지함). 본설문 첫 링크를 보내기 전에 0으로 되돌려야 180명이 칸마다 고르게(11~12명) 들어갑니다. 기록은 지워지지 않고 칸 수만 0이 됩니다.</div></div></div>
  </div>`;
}

const RENDER = { dashboard: renderDashboard, live: renderLive, monitor: renderMonitor, analytics: renderAnalytics, responses: renderResponses, logs: renderLogs, consent: renderConsent, codebook: renderCodebook, ops: renderOps, items: renderItems, tasks: renderTasks, dvars: renderDvars, trash: renderTrash, settings: renderSettings };

/* ---- 동작 ---- */
function goPage(page, pid) { if (pid) { if (page === 'logs') { S.sel.logs = pid; S.sel.logType = 'key'; } else { S.sel.resp = pid; S.sel.scrollTo = true; } } showPage(page); }
function selResp(pid) { S.sel.resp = S.sel.resp === pid ? null : pid; S.sel.scrollTo = true; renderResponses(); }
function setFlag(pid, key, on) { const patch = {}; patch[key] = on ? true : null; patch.at = new Date().toISOString(); fbUpdate('exclusions/' + pid, patch).then(() => toast(on ? '표시했습니다' : '표시를 지웠습니다')); }
function setRule(key, v) { const patch = {}; patch[key] = v; if (key === 'fastSec' && !(v > 0)) patch.fastLocked = false; if (key === 'fastLocked' && v) patch.fastLockedAt = new Date().toISOString(); fbUpdate('meta/rules', patch).then(() => toast(key === 'fastLocked' && v ? '소요 시간 하한을 고정했습니다 — 사전등록 ⑥에 같은 숫자를 적으세요' : '규칙을 저장했습니다')); }
function setPilotAction(key, v) { const patch = {}; patch[key] = String(v || '').trim() || null; fbUpdate('meta/pilotActions', patch).then(() => toast('조치를 저장했습니다')); }
function setMainStart(v) { v = String(v || '').trim(); const iso = v ? (v.length === 16 ? v + ':00+09:00' : v) : null; if (iso && isNaN(Date.parse(iso))) return toast('날짜 · 시각을 확인하세요', 'err'); fbUpdate('meta/ops', { mainStart: iso }).then(() => toast(iso ? '본 설문 시작 시각을 저장했습니다 — 그 전 기록은 테스트로 나뉩니다' : '본 설문 시작 시각을 기본값으로 되돌렸습니다')); }
function setPerDay(v) { v = Math.round(+v); if (!(v > 0)) return toast('1 이상 숫자를 넣으세요', 'err'); fbUpdate('meta/ops', { perDay: v === STUDY.perDay ? null : v }).then(() => toast(`하루 목표를 ${v}명으로 저장했습니다 (조원 모두 같이 보임)`)); }
function setDvLock(v) { fbUpdate('meta/ops', { dvLock: v === 'auto' ? null : v, dvLockAt: new Date().toISOString() }).then(() => toast(v === 'off' ? '종속변수 잠금을 껐습니다 (기록이 남습니다)' : '저장했습니다')); }
function setAtt0Code(v) { v = String(v || '').trim(); try { if (v) localStorage.setItem('moa_att0_code', v); else localStorage.removeItem('moa_att0_code'); } catch (e) { } resolveAtt0Code(); toast(v ? `7-1 저장 키를 ${ATT0.code}로 맞췄습니다` : `기록에서 찾은 키: ${ATT0.code}`); renderAll(); }
function preregExclusionText() { const R = rulesOf(); const parts = []; if (R.att) parts.push(`자극 전 지시형 주의 점검(W10 3번 "${ATT0.text}") 오답`); parts.push('중복 참여(같은 브라우저에서 다시 열면 실험물이 막음 · ONE_TIME_ONLY · 전화번호는 받지 않음)'); if (R.fast) parts.push(`소요 시간 < ${fastFixed() ? Math.round(fastThreshold()) + '초(완료 중앙값의 1/3로 11/12 고정)' : '○○초(파일럿 완료 중앙값의 1/3 · 11/12 고정 예정)'}`); return `제외 기준(주분석): ${parts.join(' · ')}. 자극 뒤 문항(Q30 24번 주의 점검 · 조작점검 Q28·Q29 · W 조작점검 Q8)으로는 빼지 않고 민감도 분석에서만 따로 본다. 재시작 · 조건 미달(만 19세 미만 · 구매 0회) · 파일럿 · 리허설 기록은 본조사 자료에 넣지 않는다.`; }
function setText(pid, key, v) { const patch = {}; patch[key] = v.trim() ? v.trim() : null; fbUpdate('exclusions/' + pid, patch).then(() => toast('저장했습니다')); }
async function trashOldP() { const list = sessionsVisible().filter(s => /^P\d{3}$/.test(s.pid)); if (!list.length) return; if (!confirm(`P로 시작하는 기록 ${list.length}건을 휴지통으로 보낼까요? 집계와 CSV에서 빠지고, 휴지통에서 되살릴 수 있습니다.`)) return; for (const s of list) await fbUpdate('exclusions/' + s.pid, { trash: true, trashAt: new Date().toISOString() }); toast(`${list.length}건을 휴지통으로 보냈습니다`); }
function resetPilotManual() { if (!confirm('미리 눌러 둔 파일럿 판정(통과/미통과·사례 수)을 모두 지울까요?')) return; fbWrite('meta/pilot', null).then(() => toast('판정을 지웠습니다')); }
function resetCellCounts() {   // 미리보기·파일럿이 차지한 16칸 배정 수를 0으로. 본설문 첫 링크 전에 한 번만. 참여 기록은 그대로
  const tot = ((data().meta || {}).cellCounts || {}).total ?? 0;
  if (!confirm(`16칸 배정 수(지금 ${tot}명)를 0으로 되돌릴까요?\n본설문을 시작하기 전에 한 번만 누르세요. 이미 본설문이 진행 중이면 누르지 마세요(배정이 다시 처음부터 쌓입니다). 참여 기록은 지워지지 않습니다.`)) return;
  fbWrite('meta/cellCounts', null).then(() => { toast('칸 수를 0으로 되돌렸습니다'); renderAll(); });
}
function setPilotCount(key, v) { const patch = {}; patch[key] = v === '' ? null : +v; fbUpdate('meta/pilot', patch).then(() => toast('사례 수를 저장했습니다')); }
function setPilotManual(key, v) { const patch = {}; patch[key] = v === '' ? null : v === '1'; fbUpdate('meta/pilot', patch).then(() => toast('판정을 저장했습니다')); }
function toTrash(pid) { if (!confirm(`${pid} 을(를) 휴지통으로 옮길까요? 집계와 CSV에서 빠집니다.`)) return; S.sel.resp = null; fbUpdate('exclusions/' + pid, { trash: true, trashAt: new Date().toISOString() }).then(() => toast('휴지통으로 옮겼습니다')); }
async function trashOldRehearsal() { const rh = rehearsalCheck(); const list = rh.old || []; if (!list.length) return; if (!confirm(`예전 실험물(${rh.oldVers.join(' · ')})로 한 연결 리허설 ${list.length}건을 휴지통으로 옮길까요? 지금 파일(${rh.ver}) 기록만 남고, 휴지통에서 되살릴 수 있습니다.`)) return; for (const s of list) await fbUpdate('exclusions/' + s.pid, { trash: true, oldRehearsal: true, trashAt: new Date().toISOString() }); toast(`${list.length}건을 휴지통으로 옮겼습니다`); }
async function trashLegacy() { const list = sessionsLegacy(); if (!list.length) return; if (!confirm(`다른 버전 기록 ${list.length}건을 휴지통으로 옮길까요?`)) return; for (const s of list) await fbUpdate('exclusions/' + s.pid, { trash: true, legacy: true, trashAt: new Date().toISOString() }); toast('휴지통으로 옮겼습니다'); }
async function permDelLegacy() { const list = sessionsLegacy(); if (!list.length) return; if (!confirm(`다른 버전 기록 ${list.length}건을 완전히 지울까요? 되돌릴 수 없습니다.`)) return; for (const s of list) for (const p of ['participants', 'live', 'consents', 'responses', 'logs', 'exclusions']) await fbWrite(`${p}/${s.pid}`, null); toast('완전히 지웠습니다'); }
function fromTrash(pid) { fbUpdate('exclusions/' + pid, { trash: null, trashAt: null }).then(() => toast('되살렸습니다')); }
async function permDel(pid) {
  if (!confirm(`${pid} 의 모든 기록(참여 기록·로그·응답·동의)을 완전히 지울까요? 되돌릴 수 없습니다.`)) return;
  for (const p of ['participants', 'live', 'consents', 'responses', 'logs', 'exclusions']) await fbWrite(`${p}/${pid}`, null);
  toast('완전히 지웠습니다');
}
async function emptyTrash() { const list = sessionsTrash(); if (!list.length) return; if (!confirm(`휴지통의 ${list.length}명을 완전히 지울까요? 되돌릴 수 없습니다.`)) return; for (const s of list) for (const p of ['participants', 'live', 'consents', 'responses', 'logs', 'exclusions']) await fbWrite(`${p}/${s.pid}`, null); toast('휴지통을 비웠습니다'); }
async function cleanLive() {
  const d = data(); const old = Object.values(d.live || {}).filter(l => { const s = sessOf(l.pid); const st = s ? statusOf(s) : 'dropped'; const at = tsOf(l.at) || 0; return st !== 'active' && !(s && s.submitted) && Date.now() - at > 86400000; });
  if (!old.length) return toast('정리할 기록이 없습니다'); if (!confirm(`하루 넘게 끊긴 live 기록 ${old.length}건을 지울까요? (참여 기록 기록은 남습니다)`)) return;
  for (const l of old) await fbWrite('live/' + l.pid, null); toast(`${old.length}건 정리했습니다`);
}
function saveConfig() {
  const cfg = parseConfigText($('#cfg-text').value);
  if (!cfg.apiKey) return toast('apiKey 가 없습니다', 'err');
  if (!cfg.databaseURL) { const u = prompt('databaseURL 을 넣어 주세요 (Realtime Database 페이지 위에 있는 https://…firebasedatabase.app 주소)'); if (!u) return; cfg.databaseURL = u.trim(); }
  localStorage.setItem('moa_fb_config', JSON.stringify(cfg)); S.viewDemo = false; connectFirebase(cfg).then(ok => { if (ok) toast('연결했습니다'); renderAll(); });
}
function saveVersion(v) { if (v === undefined) v = ($('#ver-text') || {}).value || ''; try { if (v.trim()) localStorage.setItem('moa_study_version', v.trim()); else localStorage.removeItem('moa_study_version'); } catch (e) { } toast(v.trim() ? '집계 버전을 바꿨습니다' : '기본 버전으로 돌렸습니다'); renderAll(); }
function clearConfig() { localStorage.removeItem('moa_fb_config'); toast('저장한 설정을 지웠습니다. 새로 고치면 파일 안 설정으로 연결합니다'); renderSettings(); }
function toggleDemoView() { if (S.mode !== 'fb') return; S.viewDemo = !S.viewDemo; if (S.viewDemo && !S.demoCache) S.demoCache = makeSample(); setConn(S.viewDemo ? 'demo' : (S.connected ? 'on' : 'err'), (S.config || {}).projectId); renderAll(); }
function seedSample() { S.demoCache = makeSample(); if (S.mode !== 'fb') { toast('샘플을 다시 만들었습니다'); } else { S.viewDemo = true; setConn('demo'); toast('샘플 자료로 봅니다'); } renderAll(); }

/* =========================================================
   시작 · 메뉴 · 테마 · 연결 표시
   ========================================================= */
function setConn(state, text) {
  const d = $('#conn-dot'), t = $('#conn-text'); if (!d) return;
  d.className = 'live-dot ' + (state === 'on' ? '' : state === 'demo' ? 'demo' : state === 'err' ? 'off' : 'wait');
  t.textContent = state === 'on' ? ('연결됨 · ' + (text || 'Firebase')) : state === 'demo' ? '샘플 자료' : state === 'err' ? (text || '연결 끊김') : (text || '연결 중…');
}
function showPage(page) {
  S.page = page;
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  $('#topbar-title').textContent = PAGE_TITLE[page] || page;
  closeSidebar(); renderAll(); window.scrollTo({ top: 0 });
}
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('on'); }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $$('#themeT button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
  try { localStorage.setItem('moa_theme', t); } catch (e) { }
}
function exportForPage() {
  const p = S.page;
  exportCurrent(p === 'logs' ? 'logs' : p === 'consent' ? 'consent' : p === 'analytics' ? 'tasks' : p === 'codebook' ? 'person' : p === 'monitor' ? 'monitor' : p === 'dashboard' ? 'judge' : 'responses');
}
function init() {
  applyStudyOverrides();
  let theme = 'dark'; try { theme = localStorage.getItem('moa_theme') || 'dark'; } catch (e) { }
  applyTheme(theme);
  $$('#themeT button').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.theme)));
  $$('.nav-item').forEach(n => n.addEventListener('click', () => showPage(n.dataset.page)));
  $('#toggle-btn').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#overlay').classList.toggle('on'); });
  $('#overlay').addEventListener('click', closeSidebar);
  $('#export-btn').addEventListener('click', exportForPage);
  S.demoCache = makeSample();
  const cfg = loadConfig();
  if (cfg && typeof firebase !== 'undefined') { connectFirebase(cfg); }
  else { S.mode = 'demo'; setConn('demo'); }
  showPage('dashboard');
  S.tick = setInterval(() => { if (S.page === 'live' || S.page === 'dashboard' || S.page === 'monitor') renderAll(); const c = $('#live-clock'); if (c) c.textContent = fmtDTS(Date.now()); }, 15000);
}
document.addEventListener('DOMContentLoaded', init);

</script>
